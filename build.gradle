plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'

    id "com.modrinth.minotaur" version "2.+"
    id 'net.darkhax.curseforgegradle' version '1.1.+'
    id "com.github.breadmoirai.github-release" version "2.5.2"
}

import net.darkhax.curseforgegradle.TaskPublishCurseForge

base {
    archivesName = 'mishanguc-forge'
}
version = project.mod_version + '-' + project.minecraft_version
group = project.maven_group

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: project.minecraft_version

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                mishanguc {
                    source sourceSets.main
                }
            }
        }

        client {
            args '-username=Solid'
        }

        server {
            args '--nogui'
        }

        data {
            args '--mod', 'mishanguc', '--all',
                    '--output', file('src/main/generated/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/main/generated' }

// Expand placeholders like ${mod_version} in mods.toml / pack.mcmeta
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version           : project.minecraft_version,
            supported_minecraft_versions: project.supported_minecraft_versions,
            forge_version               : project.forge_version,
            mod_version                 : project.mod_version,
            mod_id                      : project.archives_base_name
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xmaxerrs' << '5000'
}

repositories {
    maven { url 'https://jitpack.io' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // MixinExtras is bundled with Forge 47.x but needs explicit compile dependency
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.3.5"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.3.5")) {
        jarJar.ranged(it, "[0.3.5,)")
    }
}

mixin {
    add sourceSets.main, 'mishanguc.refmap.json'
    config 'mishanguc.mixins.json'
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    manifest {
        attributes([
                "Specification-Title"     : project.archives_base_name,
                "Specification-Vendor"    : "SolidBlock",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.archives_base_name,
                "Implementation-Version"  : project.mod_version,
                "Implementation-Vendor"   : "SolidBlock",
                "MixinConfigs"            : "mishanguc.mixins.json"
        ])
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}

// Update log extraction
String getUpdateLog(String modVersion = project.mod_version) {
    StringBuilder builder = new StringBuilder()
    boolean start = false
    new File('UpdateLog-en.md').eachLine {
        if (it.matches("^###\\s*" + modVersion + '$')) {
            start = true
        } else if (it.startsWith("###")) {
            start = false
        } else if (start) {
            builder.append it
            builder.append '\n'
        }
        return
    }
    return builder.toString().trim()
}

println "当前版本（${project.mod_version}）更新记录："
final var content = getUpdateLog(project.mod_version)
println content

tasks.register('curseforge', TaskPublishCurseForge) {
    def curseforgeToken = System.getenv("CURSEFORGE_TOKEN")
    println("CurseForge 令牌: ${curseforgeToken instanceof String ? curseforgeToken.replaceAll("^(.+?)(.{0,6})\$", (s, a, b) -> a.replaceAll(".", "*") + b) : curseforgeToken}")
    if (curseforgeToken) apiToken = curseforgeToken

    def mainFile = upload('583071', jar)
    mainFile.changelog = content
    mainFile.changelogType = 'markdown'
    mainFile.releaseType = project.mod_version.contains('-') ? 'beta' : 'release'

    for (final def v in ((project.supported_minecraft_versions as String).split(','))) {
        mainFile.addGameVersion v
    }

    mainFile.addRelations 'requiredDependency', 'forge'
}

modrinth {
    def modrinthToken = System.getenv("MODRINTH_TOKEN")
    if (modrinthToken) token = modrinthToken
    println "Modrinth 令牌：${modrinthToken instanceof String ? modrinthToken.replaceAll("^(.+?)(.{0,6})\$", (s, a, b) -> a.replaceAll(".", "*") + b) : modrinthToken}"

    projectId = "rItLmRo4"
    versionNumber = project.mod_version + '-' + project.minecraft_version
    versionType = project.mod_version.contains('-') ? 'beta' : 'release'
    uploadFile = jar
    gameVersions = Arrays.asList(project.supported_minecraft_versions.split(','))

    changelog = content

    loaders = ['forge']

    dependencies = []
}

githubRelease {
    def githubToken = System.getenv("GITHUB_TOKEN")
    println "GitHub 令牌: ${githubToken instanceof String ? githubToken.replaceAll("^(.+?)(.{0,6})\$", (s, a, b) -> a.replaceAll(".", "*") + b) : githubToken}"
    if (githubToken) token = githubToken
    owner = "SolidBlock-cn"
    repo = "mishanguc"
    tagName = "v$project.mod_version"
    targetCommitish = "1.20.1"
    body = content
    draft = true
    prerelease = false
    releaseAssets jar
    allowUploadToExisting = true
    apiEndpoint = "https://api.github.com"
}

publish {
    dependsOn tasks.curseforge, tasks.modrinth, tasks.githubRelease
}
